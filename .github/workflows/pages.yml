name: Build & deploy dashboard

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      publish_forecast_model:
        description: 'Publish the secondary ash model (human approval)'
        type: boolean
        default: false
      approver_name:
        description: 'Your name/handle (stamped as approver on the site)'
        type: string
        default: ''

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies
        run: |
          pip install -r requirements.txt
          pip install pillow
      - name: Build site data + assets
        run: |
          if [ -f src/build_site.py ]; then B=src/build_site.py; else B=build_site.py; fi
          if [ "${{ github.event.inputs.publish_forecast_model }}" = "true" ]; then
            python3 $B --approve-forecast --approver "${{ github.event.inputs.approver_name || github.actor }}"
          else
            python3 $B
          fi
      - name: Commit the approved model so it survives future rebuilds
        if: github.event.inputs.publish_forecast_model == 'true'
        run: |
          git config user.name  "krakatau-bot"
          git config user.email "krakatau-bot@users.noreply.github.com"
          git add site/data/forecast_model.json
          git diff --cached --quiet || { git commit -m "forecast model approved by ${{ github.event.inputs.approver_name || github.actor }}"; git push; }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
