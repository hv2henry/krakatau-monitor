name: Build & deploy dashboard

# ---------------------------------------------------------------------------
#   Automatic : every 15 minutes the job re-collects MAGMA + Darwin VAAC,
#               re-stitches NASA imagery, and redeploys.
#   Manual    : "Run workflow" button in the Actions tab.
#               Tick `publish_forecast_model` to push the secondary model to
#               the site — that checkbox IS the human-in-the-loop approval.
#               Type your handle in `approver_name`; it is stamped on the page.
# ---------------------------------------------------------------------------
on:
  schedule:
    - cron: '*/15 * * * *'
  push:                 # rebuild on any commit (also re-registers the schedule)
    branches: [main, master]
  workflow_dispatch:
    inputs:
      publish_forecast_model:
        description: 'Publish the secondary ash model (human approval)'
        type: boolean
        default: false
      approver_name:
        description: 'Your name/handle (stamped as approver on the site)'
        type: string
        default: ''

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: write   # needed ONLY so an approved model file can be committed back
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Dependencies
        run: |
          pip install -r requirements.txt
          pip install pillow

      - name: Build site data + assets
        run: |
          if [ -f src/build_site.py ]; then B=src/build_site.py; else B=build_site.py; fi
          if [ "${{ github.event.inputs.publish_forecast_model }}" = "true" ]; then
            python3 $B --approve-forecast --approver "${{ github.event.inputs.approver_name || github.actor }}"
          else
            python3 $B
          fi

      - name: Commit model approvals and the backtest ledger
        if: always()
        run: |
          git config user.name  "krakatau-bot"
          git config user.email "krakatau-bot@users.noreply.github.com"
          git add site/data/backtest.jsonl || true
          git add site/data/forecast_model.json || true
          git diff --cached --quiet || { git commit -m "model/backtest ledger ${{ github.run_id }}"; git push; }

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
