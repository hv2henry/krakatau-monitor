name: Watchdog

# ---------------------------------------------------------------------------
# Deliberately SEPARATE from the monitor workflow.
#
# A watchdog that lives inside the job it supervises cannot report that job's
# death. If `monitor.yml` starts failing (scraper broke, MAGMA changed markup,
# a secret expired, GitHub's scheduler skipped it), the heartbeat stops
# advancing — and your community sees silence, which reads as "all clear".
#
# This workflow only reads the heartbeat and shouts if it has gone stale.
# Run it on an offset from the monitor so they don't collide.
# ---------------------------------------------------------------------------
on:
  schedule:
    - cron: '7,37 * * * *'     # twice hourly, offset from the monitor's */15
  workflow_dispatch: {}

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check pipeline heartbeat
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: |
          python3 src/publish.py --check-heartbeat --max-staleness-min 90 --telegram --ntfy-auto

      # If Supabase itself is unreachable the check above can't tell the
      # difference between "monitor is dead" and "archive is dead". Either way
      # you want to know, so fail loudly rather than exiting green.
      - name: Fail the run if the check failed
        if: failure()
        run: |
          echo "::error::Watchdog could not confirm the monitor is alive."
          exit 1
